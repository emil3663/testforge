name: Nightly

# TFP-210: the unit suite and the template check, too slow for every push (about 12 min of units
# locally), so nightly and on manual dispatch.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      template-base:
        description: "Base ref for check:template-unchanged (default: the recorded template baseline)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  # The template baseline: the last commit whose template output was checked and accepted. A change that
  # alters the output on purpose updates it here, in its own commit, as TFP-205's baseline was (63de663).
  TEMPLATE_BASELINE: d95fb61

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # --experimental-strip-types needs Node 22.6 or later; .nvmrc (24) is the one version CI and local runs use (TFP-216).
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The real-browser unit tests skip without Chromium (TST-01); here none may skip for that.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # shell: bash gives `bash -eo pipefail`; the default (`bash -e`) takes tee's exit code, so the step couldn't fail.
      - name: Run the unit suite
        shell: bash
        run: npm run test:unit 2>&1 | tee unit.log

      - name: Upload the unit log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-log-${{ github.run_number }}-${{ github.run_attempt }}
          path: unit.log
          if-no-files-found: warn
          retention-days: 30

  # TFP-266: the app's own dependencies can't drift back unnoticed. Dev tooling isn't checked: it has advisories
  # `npm audit fix` can't clear (the commit that added this lists them).
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check the app's dependencies for high and critical advisories
        shell: bash
        run: npm audit --omit=dev --audit-level=high

  template-unchanged:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # The check extracts the base ref with git archive, so it needs the history.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the template output is unchanged against the baseline
        env:
          BASE: ${{ inputs.template-base || env.TEMPLATE_BASELINE }}
        run: npm run check:template-unchanged -- "$BASE" HEAD
