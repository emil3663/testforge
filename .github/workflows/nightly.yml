name: Nightly

# TFP-210: the unit suite and the template check, too slow for every push (about 12 min of units
# locally), so nightly and on manual dispatch. The advisory audit (TFP-266) and the dead-code check
# (TFP-259) run alongside them, and each run emails its summary (TFP-217). A red night opens or updates one
# failure issue, and the next green one closes it (TFP-252).

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      template-base:
        description: "Base ref for check:template-unchanged (default: the recorded template baseline)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  # The template baseline: the last commit whose template output was checked and accepted. A change that
  # alters the output on purpose updates it here, in its own commit, as TFP-205's baseline was (63de663).
  TEMPLATE_BASELINE: 48604dc

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      summary: ${{ steps.counts.outputs.summary }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # --experimental-strip-types needs Node 22.6 or later; .nvmrc (24) is the one version CI and local runs use (TFP-216).
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The real-browser unit tests skip without Chromium (TST-01); here none may skip for that.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # shell: bash gives `bash -eo pipefail`; the default (`bash -e`) takes tee's exit code, so the step couldn't fail.
      - name: Run the unit suite
        shell: bash
        run: npm run test:unit 2>&1 | tee unit.log

      # TFP-217: the counts and failing names, for the notify job.
      - name: Pass on the unit counts
        id: counts
        if: always()
        shell: bash
        run: node scripts/nightly-email/notify.mjs unit unit.log >> "$GITHUB_OUTPUT"

      - name: Upload the unit log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-log-${{ github.run_number }}-${{ github.run_attempt }}
          path: unit.log
          if-no-files-found: warn
          retention-days: 30

  # TFP-266: the app's own dependencies can't drift back unnoticed. Dev tooling isn't checked: it has advisories
  # `npm audit fix` can't clear (the commit that added this lists them).
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check the app's dependencies for high and critical advisories
        shell: bash
        run: npm audit --omit=dev --audit-level=high

  # TFP-259: unused files, exports and dependencies; knip.jsonc says why each exception is there.
  dead-code:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for dead code
        run: npx knip

  template-unchanged:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      line: ${{ steps.check-line.outputs.line }}

    steps:
      # The check extracts the base ref with git archive, so it needs the history.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the template output is unchanged against the baseline
        shell: bash
        env:
          BASE: ${{ inputs.template-base || env.TEMPLATE_BASELINE }}
        run: npm run check:template-unchanged -- "$BASE" HEAD 2>&1 | tee template.log

      - name: Pass on the check's line
        id: check-line
        if: always()
        shell: bash
        run: node scripts/nightly-email/notify.mjs template template.log >> "$GITHUB_OUTPUT"

  # TFP-252: a red night opens one "Nightly failing" issue, or comments on the open one, with the failing tests, the
  # run and the commits since the last green run; the next green run closes it. No model. Its own job, so the
  # token that can write issues and the SMTP password are never in one job. A cancelled run isn't a red night: the
  # job is skipped, and the email says so.
  issue:
    needs: [unit, audit, dead-code, template-unchanged]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    outputs:
      action: ${{ steps.issue.outputs.action }}
      url: ${{ steps.issue.outputs.url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Needs nothing installed: node and gh, which the runner has.
      - name: Open, update or close the failure issue
        id: issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          WORKFLOW_FILE: nightly.yml
        run: node scripts/nightly-email/notify.mjs issue >> "$GITHUB_OUTPUT"

  # TFP-217: every run says how it went, on its own page and by email, whether its jobs passed, failed or were
  # cancelled. A failed send fails this job, so a missing email shows here. The password reaches only the send step.
  # TFP-252: it waits for the issue job, so the email links the issue.
  notify:
    needs: [unit, audit, dead-code, template-unchanged, issue]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        if: always()
        uses: actions/checkout@v7

      - name: Set up Node.js
        if: always()
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # No install script runs here: this job goes on to hold the SMTP password.
      - name: Install dependencies
        if: always()
        run: npm ci --ignore-scripts

      - name: Build the summary
        if: always()
        env:
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
          COMMIT: ${{ github.sha }}
          TEMPLATE_BASE: ${{ inputs.template-base || env.TEMPLATE_BASELINE }}
        run: node scripts/nightly-email/notify.mjs build nightly-email.json

      - name: Send the summary
        if: always()
        env:
          TESTFORGE_SMTP_PASSWORD: ${{ secrets.TESTFORGE_SMTP_PASSWORD }}
          CI_REPORT_TO: ${{ vars.CI_REPORT_TO }}
        run: node scripts/nightly-email/notify.mjs send nightly-email.json
