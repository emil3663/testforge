name: Regression Test

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  regression-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run lint
        run: npm run lint

      - name: Run TestForge regression suite with Allure
        run: npm run test:regression:allure

      - name: Upload regression Allure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-regression-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            artifacts/allure-report/regression
            artifacts/allure-results/regression
          if-no-files-found: warn
          retention-days: 30

      - name: Prune older regression reports
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          ARTIFACT_PREFIX: allure-regression-
        with:
          script: |
            const prefix = process.env.ARTIFACT_PREFIX;
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner,
              repo,
              per_page: 100,
            });

            const matchingArtifacts = artifacts
              .filter((artifact) => !artifact.expired && artifact.name.startsWith(prefix))
              .sort((left, right) => new Date(right.created_at) - new Date(left.created_at));

            core.info(`Found ${matchingArtifacts.length} regression report artifacts.`);

            for (const artifact of matchingArtifacts.slice(5)) {
              core.info(`Deleting ${artifact.name} (${artifact.id}).`);
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id,
              });
            }