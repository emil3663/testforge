name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  checks: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run linting
        run: npm run lint

      # Phase 48 (TFP-280): the old name stays only where scripts/old-name/allowlist.json says why.
      - name: Check for the old name
        run: npm run check:old-name

      # TFP-283: the script builds first (build:self-test) and Playwright's webServer only starts, so its
      # 120 s covers the start alone. The production build runs after the tests (below).
      - name: Run smoke tests with Allure
        run: npm run test:self:allure

      - name: Upload smoke Allure artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-smoke-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            artifacts/allure-report/smoke
            artifacts/allure-results/smoke
          if-no-files-found: warn
          retention-days: 30

      # TFP-283 (owner ruling, 2026-11-14): the smoke suite's build uses .env.development's values, so this
      # checks the production build without them. After the smoke tests, and before the comments, so a
      # failing build is never reported as a pass.
      - name: Run production build
        run: npm run build

      - name: Comment PR on success
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **PR validation passed** — lint, build, and smoke tests all passing.'
            })

      - name: Comment PR on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **PR validation failed** — please review lint, build, or test output above.'
            })
